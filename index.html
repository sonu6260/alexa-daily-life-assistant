
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexa+ Daily Life Assistant</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fc;color:#182337}
header{background:#172554;color:white;padding:22px;text-align:center}
header p{color:#c7d2fe}
main{max-width:950px;margin:25px auto;padding:0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:white;padding:20px;border-radius:16px;box-shadow:0 4px 18px #15254a12}
h2{font-size:19px}
input,button{padding:12px;border-radius:8px;font-size:15px}
input{width:100%;border:1px solid #cbd5e1;margin:6px 0}
button{border:0;background:#2563eb;color:white;cursor:pointer}
button:hover{background:#1d4ed8}
form{display:flex;gap:6px}
form input{min-width:0}
form button{white-space:nowrap}
ul{padding-left:20px}
li{padding:7px 0;overflow-wrap:anywhere}
li button{padding:5px 9px;margin-left:6px;background:#dc2626}
#chat{height:210px;overflow:auto;background:#f8fafc;padding:12px;border-radius:8px}
.msg{padding:8px;margin:6px 0;border-radius:8px;background:#e0e7ff}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>
<header>
  <h1>✨ Alexa+ Daily Life Assistant</h1>
  <p>Your daily planner, shopping list and personal helper</p>
</header>
<main>
<div class="cards">
<section class="card">
<h2>📅 Daily Tasks</h2>
<form id="taskForm">
<input id="taskInput" placeholder="Enter a task..." required>
<button>Add</button>
</form>
<ul id="tasks"></ul>
</section>
<section class="card">
<h2>🛒 Shopping List</h2>
<form id="shopForm">
<input id="shopInput" placeholder="Add shopping item..." required>
<button>Add</button>
</form>
<ul id="shopping"></ul>
</section>
<section class="card">
<h2>💬 Assistant</h2>
<div id="chat" aria-live="polite">
<div class="msg">Hello! Ask me to plan your day or add a task.</div>
</div>
<form id="chatForm">
<input id="chatInput" placeholder="Type a message..." required>
<button>Send</button>
</form>
</section>
</div>
</main>
<footer>Personal productivity prototype</footer>

<script>
const load = key => {
  try {
    const data = JSON.parse(localStorage.getItem(key));
    return Array.isArray(data) ? data : [];
  } catch {
    return [];
  }
};

let tasks = load("dailyTasks");
let shopping = load("shoppingItems");
let completed = load("completedTasks");

function save(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function render(list, element, key, isTask = false) {
  element.replaceChildren();

  list.forEach((item, index) => {
    const li = document.createElement("li");
    const text = document.createElement("span");
    text.textContent = item;

    if (isTask && completed.includes(item)) {
      text.style.textDecoration = "line-through";
      text.style.color = "#64748b";
    }

    li.append(text);

    if (isTask) {
      const done = document.createElement("button");
      done.textContent = completed.includes(item)
        ? "Undo"
        : "Complete";
      done.style.background = "#16a34a";
      done.type = "button";

      done.onclick = () => {
        if (completed.includes(item)) {
          completed = completed.filter(t => t !== item);
        } else {
          completed.push(item);
        }
        save("completedTasks", completed);
        refresh();
      };

      li.append(done);
    }

    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.type = "button";

    remove.onclick = () => {
      list.splice(index, 1);
      if (isTask) {
        completed = completed.filter(t => t !== item);
        save("completedTasks", completed);
      }
      save(key, list);
      refresh();
    };

    li.append(remove);
    element.append(li);
  });
}

function refresh() {
  render(tasks, document.getElementById("tasks"),
    "dailyTasks", true);
  render(shopping, document.getElementById("shopping"),
    "shoppingItems");
}

function addTask(value) {
  const task = value.trim();
  if (!task) return false;
  tasks.push(task);
  save("dailyTasks", tasks);
  refresh();
  return true;
}

function addShopping(value) {
  const item = value.trim();
  if (!item) return false;
  shopping.push(item);
  save("shoppingItems", shopping);
  refresh();
  return true;
}

document.getElementById("taskForm").onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById("taskInput");
  if (addTask(input.value)) input.value = "";
};

document.getElementById("shopForm").onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById("shopInput");
  if (addShopping(input.value)) input.value = "";
};

function reply(message) {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "msg";
  row.textContent = message;
  chat.append(row);
  chat.scrollTop = chat.scrollHeight;
}

function handleMessage(message) {
  const text = message.trim();
  const lower = text.toLowerCase();

  if (lower.startsWith("add task ")) {
    const task = text.slice(9).trim();
    return addTask(task)
      ? `Task added: ${task}`
      : "Please enter a task name.";
  }

  if (lower.startsWith("add shopping ")) {
    const item = text.slice(13).trim();
    return addShopping(item)
      ? `Shopping item added: ${item}`
      : "Please enter a shopping item.";
  }

  if (
    lower.startsWith("complete task ") ||
    lower.startsWith("finish task ")
  ) {
    const taskName = text.slice(
      lower.startsWith("complete task ") ? 14 : 12
    ).trim().toLowerCase();

    const task = tasks.find(t => t.toLowerCase() === taskName);

    if (!task) return "I couldn't find that task.";

    if (!completed.includes(task)) completed.push(task);
    save("completedTasks", completed);
    refresh();
    return `Task completed: ${task}`;
  }

  if (
    lower.includes("shopping list") ||
    lower.includes("grocery") ||
    lower === "show shopping"
  ) {
    return shopping.length
      ? "Your shopping list: " + shopping.join(", ")
      : "Your shopping list is empty.";
  }

  if (
    lower.includes("my tasks") ||
    lower.includes("plan my day") ||
    lower === "plan my day" ||
    lower === "show tasks" ||
    lower === "show my tasks" ||
    lower.includes("daily plan")
  ) {
    if (!tasks.length) return "No tasks yet. Add your first task!";

    const pending = tasks.filter(t => !completed.includes(t));
    const done = tasks.filter(t => completed.includes(t));

    return `Your day: ${pending.length} pending, ${done.length} completed. ` +
      (pending.length ? "To do: " + pending.join(", ") : "All tasks completed!");
  }

  if (lower === "help" || lower.includes("what can you do")) {
    return "Try: Add task study PHP, Complete task study PHP, " +
      "Show my tasks, Add shopping milk, or Show my shopping list.";
  }

  return "I can manage tasks and shopping lists. Type Help to see commands.";
}

document.getElementById("chatForm").onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const message = input.value.trim();

  if (!message) return;

  reply("You: " + message);
  reply("Assistant: " + handleMessage(message));
  input.value = "";
};

refresh();
</script>

</body>
</html>
